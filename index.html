e:11px;font-weight:700}.pill.completed{background:#e0ede4;color:var(--green)}.pill.pending{background:#eae6d8;color:#7a6f52}.pill.overdue{background:#f4d6d1;color:var(--red)}input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:4px;background:#fff;font:inherit;font-size:13px}label{display:block;margin:9px 0 4px;font-size:12px;font-weight:700;color:#6b6355}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.msg{padding:9px 11px;border-radius:4px;margin-bottom:12px;font-size:12.5px}.msg.ok{background:#e0ede4;color:var(--green)}.msg.err{background:#f4d6d1;color:var(--red)}.muted{color:#8a8272;font-size:12px}.auth{max-width:420px;margin:70px auto}.auth .card{padding:22px}.stack{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;padding:0}.photo-thumb{width:74px;height:56px;object-fit:cover;border:1px solid var(--line);border-radius:3px}.danger{color:var(--red);font-weight:700}.success{color:var(--green);font-weight:700}@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.app{padding:14px 10px 40px}table{font-size:12px}}

<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const SUPABASE_URL='https://ufrsbskwjzlsvvxuciox.supabase.co';
const SUPABASE_KEY='sb_publishable_oDZnVdHGu8rgUXmnsnJFQw_-uvWpdSX';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const iso=()=>new Date().toISOString().slice(0,10);

const monthStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10)};

function AuthScreen(){
  const [mode,setMode]=useState('login'); const [email,setEmail]=useState(''); const [password,setPassword]=useState(''); const [name,setName]=useState(''); const [msg,setMsg]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const emailRef=React.useRef(null), passwordRef=React.useRef(null), nameRef=React.useRef(null);
  const submit=async(e)=>{e?.preventDefault();setBusy(true);setMsg('');setErr('');try{
    const liveEmail=(emailRef.current?.value||email).trim();
    const livePassword=(passwordRef.current?.value||password);
    const liveName=(nameRef.current?.value||name).trim();
    if(!liveEmail) throw new Error('Please enter your email.');
    if(!livePassword) throw new Error('Please enter your password.');
    if(mode==='signup'){if(!liveName) throw new Error('Full name is required.');const {error}=await sb.auth.signUp({email:liveEmail,password:livePassword,options:{data:{full_name:liveName}}});if(error)throw error;setMsg('Account created. Check your email if confirmation is enabled, then sign in.');setMode('login');}
    else {const {data,error}=await sb.auth.signInWithPassword({email:liveEmail,password:livePassword});if(error)throw error;if(data.session){setMsg('Login successful. Loading Neo…')}}
  }catch(e){setErr(e?.message||'Unable to continue.')}finally{setBusy(false)}};
  return <div className="app"><div className="auth"><div className="brand"><span className="mark">Neo</span><span className="sub">Site Management</span></div><form className="card" onSubmit={submit}><h2>{mode==='login'?'Welcome back':'Create Neo account'}</h2><p className="muted">Production authentication powered by Supabase.</p>{mode==='signup'&&<><label>Full name</label><input ref={nameRef} autoComplete="name" value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name"/></>}<label>Email</label><input ref={emailRef} type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@example.com"/><label>Password</label><input ref={passwordRef} type="password" autoComplete={mode==='login'?'current-password':'new-password'} value={password} onChange={e=>setPassword(e.target.value)} placeholder="Minimum 6 characters"/><div style={{marginTop:12}}><button type="submit" className="btn" disabled={busy}>{busy?'Please wait…':mode==='login'?'Sign in':'Create account'}</button></div>{msg&&<div className="msg ok" style={{marginTop:12}}>{msg}</div>}{err&&<div className="msg err" style={{marginTop:12}}>{err}</div>}<div style={{marginTop:12,fontSize:12}}><button type="button" className="linkbtn" onClick={()=>{setMode(mode==='login'?'signup':'login');setMsg('');setErr('')}}>{mode==='login'?'Create a new account':'Back to sign in'}</button></div></form></div></div>
}

async function fetchDb(session){
  const uid=session.user.id;
  const {data:ensured,error:ensureErr}=await sb.rpc('neo_ensure_profile');
  if(ensureErr) throw ensureErr;
  const profile=ensured;
  const results=await Promise.all([
    sb.from('neo_projects').select('*').order('name'),
    sb.from('neo_project_memberships').select('*'),
    sb.from('neo_profiles').select('*'),
    sb.from('neo_work_schedules').select('*').order('planned_date'),
    sb.from('neo_daily_reports').select('*').order('report_date',{ascending:false}),
    sb.from('neo_payments').select('*').order('payment_date',{ascending:false}),
    sb.from('neo_punches').select('*').order('punched_at',{ascending:false}),
    sb.from('neo_monthly_reports').select('*').order('report_month',{ascending:false})
  ]);
  const [projectsR,membershipsR,usersR,schedulesR,reportsR,paymentsR,punchesR,monthlyR]=results;
  const projects=projectsR.data||[]; const memberships=membershipsR.data||[]; const users=usersR.data||[];
  const access=memberships;
  const role=profile.role;
  const visibleProjectIds=role==='master'?projects.map(p=>p.id):access.filter(m=>m.user_id===uid).map(m=>m.project_id);
  const safeUsers=users.map(u=>({...u,projectIds:access.filter(m=>m.user_id===u.id).map(m=>m.project_id)}));
  return {me:profile,projects,users:safeUsers,memberships:access,schedule:schedulesR.data||[],reports:reportsR.data||[],payments:paymentsR.data||[],punches:punchesR.data||[],monthlyReports:monthlyR.data||[],visibleProjectIds};
}

function App(){
  const [session,setSession]=useState(null); const [db,setDb]=useState(null); const [loading,setLoading]=useState(true); const [tab,setTab]=useState(''); const [flash,setFlash]=useState(null);
  const say=(text,type='ok')=>{setFlash({text,type});setTimeout(()=>setFlash(null),3500)};
  useEffect(()=>{let alive=true;sb.auth.getSession().then(async({data})=>{if(!alive)return;setSession(data.session||null);if(data.session){try{setDb(await fetchDb(data.session))}catch(e){say(e.message||'Could not load Neo data','err')}}setLoading(false)});const {data:listener}=sb.auth.onAuthStateChange(async(_event,s)=>{if(!alive)return;setSession(s);if(s){try{setDb(await fetchDb(s));}catch(e){setFlash({text:e.message||'Could not load Neo data',type:'err'})}}else setDb(null)});return()=>{alive=false;listener.subscription.unsubscribe()};},[]);
  useEffect(()=>{if(db?.me?.role&&!tab)setTab(db.me.role==='master'?'reports':db.me.role==='engineer'?'punch':'reports')},[db,tab]);
  if(loading)return <div className="app"><p className="muted">Loading Neo…</p></div>;
  if(!session||!db)return <AuthScreen/>;
  const role=db.me.role;
  const tabs={master:[['reports','Site Reports'],['schedule','Schedule'],['payments','Payments'],['punch','Punch Log'],['monthly','Monthly Report'],['access','Users & Access']],engineer:[['punch','Punch In/Out'],['reports','Daily Site Report'],['schedule','Work Schedule']],client:[['reports','Daily Work Report'],['schedule','Work Schedule Report']],architect:[['reports','Work Completed'],['schedule','Work Schedule Report']]}[role]||[];
  const claimMaster=async()=>{const {data,error}=await sb.rpc('neo_claim_first_master');if(error)return say(error.message,'err');if(!data)return say('A master account already exists.','err');setDb(await fetchDb(session));setTab('reports');say('This account is now the Neo Master account.');};
  return <div className="app"><div className="brand"><span className="mark">Neo</span><span className="sub">Site Management</span></div><div className="topbar"><div className="who">Logged in as <b>{db.me.full_name}</b><span className="role-tag">{role}</span></div><div style={{display:'flex',gap:8}}>{role==='engineer'&&<button className="btn orange small" onClick={claimMaster}>Claim Master (first admin)</button>}<button className="btn ghost small" onClick={()=>sb.auth.signOut()}>Log out</button></div></div>{flash&&<div className={'msg '+(flash.type==='ok'?'ok':'err')}>{flash.text}</div>}<div className="tabs">{tabs.map(([k,l])=><div key={k} className={'tab '+(tab===k?'active':'')} onClick={()=>setTab(k)}>{l}</div>)}</div>{tab==='reports'&&<Reports role={role} db={db} session={session} refresh={async()=>setDb(await fetchDb(session))} say={say}/>} {tab==='schedule'&&<Schedule role={role} db={db} session={session} refresh={async()=>setDb(await fetchDb(session))} say={say}/>} {tab==='payments'&&<Payments db={db} session={session} refresh={async()=>setDb(await fetchDb(session))} say={say}/>} {tab==='punch'&&<Punch role={role} db={db} session={session} refresh={async()=>setDb(await fetchDb(session))} say={say}/>} {tab==='monthly'&&<Monthly db={db} session={session} refresh={async()=>setDb(await fetchDb(session))} say={say}/>} {tab==='access'&&<Access db={db} session={session} refresh={async()=>setDb(await fetchDb(session))} say={say}/>}</div>
}

function Reports({role,db,session,refresh,say}){const mine=db.visibleProjectIds;const [projectId,setProjectId]=useState(mine[0]||'');const [work,setWork]=useState('');const [taskId,setTask]=useState('');const [photo,setPhoto]=useState(null);const canEdit=role==='master'||role==='engineer';const projects=db.projects.filter(p=>mine.includes(p.id));const reports=db.reports.filter(r=>role==='master'||mine.includes(r.project_id));const tasks=db.schedule.filter(s=>s.project_id===projectId&&s.status!=='completed');const save=async()=>{if(!projectId||!work.trim())return say('Project and work description are required.','err');const row={project_id:projectId,report_date:iso(),work_done:work.trim(),photo_path:photo,task_id:taskId||null,created_by:session.user.id};const {error}=await sb.from('neo_daily_reports').insert(row);if(error)return say(error.message,'err');if(taskId){const {error:e2}=await sb.from('neo_work_schedules').update({status:'completed',completed_date:iso(),updated_at:new Date().toISOString()}).eq('id',taskId);if(e2)return say(e2.message,'err')}setWork('');setTask('');setPhoto(null);await refresh();say('Daily site report saved. Schedule updated automatically.');};return <div>{canEdit&&<div className="card"><h3>Add daily site report</h3><div className="grid2"><div><label>Project</label><select value={projectId} onChange={e=>{setProjectId(e.target.value);setTask('')}}>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div><div><label>Completed schedule task (optional)</label><select value={taskId} onChange={e=>setTask(e.target.value)}><option value="">— none —</option>{tasks.map(t=><option key={t.id} value={t.id}>{t.task}</option>)}</select></div></div><label>Work completed today</label><textarea rows="3" value={work} onChange={e=>setWork(e.target.value)} placeholder="Describe today's completed work"/><label>Photo</label><input type="file" accept="image/*" onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f)}}/><div style={{marginTop:12}}><button className="btn" onClick={save}>Save report</button></div></div>}<div className="card"><h3>{role==='client'?'Daily work report (view only)':role==='architect'?'Daily work completed (view only)':'Site reports'}</h3><table><thead><tr><th>Date</th><th>Project</th><th>Work done</th><th>Photo</th></tr></thead><tbody>{reports.length?reports.map(r=><tr key={r.id}><td>{r.report_date}</td><td>{db.projects.find(p=>p.id===r.project_id)?.name||'—'}</td><td>{r.work_done}{r.task_id&&<div className="muted">✓ linked schedule task</div>}</td><td>{r.photo_path?<img className="photo-thumb" src={r.photo_path}/>: '—'}</td></tr>):<tr><td colSpan="4" className="muted">No reports yet.</td></tr>}</tbody></table></div></div>}

function Schedule({role,db,session,refresh,say}){const mine=db.visibleProjectIds;const projects=db.projects.filter(p=>mine.includes(p.id));const visible=db.schedule.filter(s=>mine.includes(s.project_id));const [projectId,setProjectId]=useState(projects[0]?.id||'');const [task,setTask]=useState('');const [date,setDate]=useState(iso());const [assigned,setAssigned]=useState('');const add=async()=>{if(!projectId||!task.trim()||!date)return say('Project, task and date are required.','err');const {error}=await sb.from('neo_work_schedules').insert({project_id:projectId,task:task.trim(),planned_date:date,assigned_to:assigned||null,created_by:session.user.id});if(error)return say(error.message,'err');setTask('');await refresh();say('Schedule task added.');};const reason=async(s,e)=>{const v=e.target.value.trim();if(!v)return say('Delay reason is compulsory for overdue work.','err');const {error}=await sb.from('neo_work_schedules').update({delay_reason:v,updated_at:new Date().toISOString()}).eq('id',s.id);if(error)say(error.message,'err');else refresh()};return <div>{role==='master'&&<div className="card"><h3>Update work schedule</h3><div className="grid3"><div><label>Project</label><select value={projectId} onChange={e=>setProjectId(e.target.value)}>{projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div><div><label>Task</label><input value={task} onChange={e=>setTask(e.target.value)} placeholder="e.g. Waterproofing — terrace"/></div><div><label>Planned date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div></div><label>Assign to</label><select value={assigned} onChange={e=>setAssigned(e.target.value)}><option value="">— unassigned —</option>{db.users.filter(u=>u.role==='engineer').map(u=><option key={u.id} value={u.id}>{u.full_name}</option>)}</select><div style={{marginTop:12}}><button className="btn" onClick={add}>Add to schedule</button></div></div>}<div className="card"><h3>Work schedule</h3><p className="muted">Overdue incomplete work is highlighted red; delay reason is compulsory. Completing a linked daily report closes the task automatically.</p><table><thead><tr><th>Project</th><th>Task</th><th>Planned</th><th>Status</th><th>Assigned</th><th>Delay reason</th></tr></thead><tbody>{visible.map(s=>{const overdue=s.status!=='completed'&&s.planned_date<iso();return <tr key={s.id} className={overdue?'overdue':''}><td>{db.projects.find(p=>p.id===s.project_id)?.name}</td><td>{s.task}</td><td>{s.planned_date}{s.completed_date&&<div className="muted">done {s.completed_date}</div>}</td><td><span className={'pill '+(s.status==='completed'?'completed':overdue?'overdue':'pending')}>{s.status==='completed'?'Completed':overdue?'Delayed':'Pending'}</span></td><td>{db.users.find(u=>u.id===s.assigned_to)?.full_name||'—'}</td><td>{overdue?(role==='master'?<input defaultValue={s.delay_reason||''} placeholder="Reason required *" onBlur={e=>reason(s,e)}/>:<span className="danger">{s.delay_reason||'Reason pending *'}</span>):(s.delay_reason||'—')}</td></tr>})}</tbody></table></div></div>}

function Payments({db,session,refresh,say}){const [projectId,setProjectId]=useState(db.projects[0]?.id||'');const [date,setDate]=useState(iso());const [amount,setAmount]=useState('');const [note,setNote]=useState('');const add=async()=>{if(!amount)return say('Enter an amount.','err');const {error}=await sb.from('neo_payments').insert({project_id:projectId,payment_date:date,amount:Number(amount),note,created_by:session.user.id});if(error)return say(error.message,'err');setAmount('');setNote('');await refresh();say('Payment recorded.');};return <div><div className="card"><h3>Add payment record</h3><div className="grid3"><div><label>Project</label><select value={projectId} onChange={e=>setProjectId(e.target.value)}>{db.projects.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</select></div><div><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)}/></div><div><label>Amount (₹)</label><input type="number" value={amount} onChange={e=>setAmount(e.target.value)}/></div></div><label>Note</label><input value={note} onChange={e=>setNote(e.target.value)} placeholder="Milestone / payment note"/><div style={{marginTop:12}}><button className="btn" onClick={add}>Save payment</button></div></div><div className="card"><h3>Payment history</h3><table><thead><tr><th>Date</th><th>Project</th><th>Amount</th><th>Note</th></tr></thead><tbody>{db.payments.map(p=><tr key={p.id}><td>{p.payment_date}</td><td>{db.projects.find(x=>x.id===p.project_id)?.name}</td><td>₹{Number(p.amount).toLocaleString('en-IN')}</td><td>{p.note||'—'}</td></tr>)}</tbody></table></div></div>}

function Punch({role,db,session,refresh,say}){const mine=db.punches.filter(p=>p.user_id===session.user.id);const [locStatus,setLocStatus]=useState('');const [checking,setChecking]=useState(false);const getLocation=()=>new Promise((resolve,reject)=>{if(!window.isSecureContext)return reject(new Error('This page is not using HTTPS. Open the Vercel HTTPS URL.'));if(!navigator.geolocation)return reject(new Error('This browser does not provide GPS location.'));navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:20000,maximumAge:0});});const explain=err=>{if(err instanceof Error)return err.message;const code=err?.code;if(code===1)return 'Location permission denied. Chrome: click the lock icon → Site settings → Location → Allow, then refresh the page.';if(code===2)return 'Location could not be determined. Turn on Windows Location Services, make sure Wi-Fi is enabled, and retry.';if(code===3)return 'Location request timed out. Move near a window / enable Wi-Fi or GPS and retry.';return 'Unable to get device location. Check browser and device location settings.';};const testLocation=async()=>{setChecking(true);setLocStatus('Requesting device location…');try{const pos=await getLocation();const text='Location captured: '+pos.coords.latitude.toFixed(5)+', '+pos.coords.longitude.toFixed(5);setLocStatus(text);say(text,'ok');}catch(err){const msg=explain(err);setLocStatus(msg);say(msg,'err');}finally{setChecking(false);}};const punch=async type=>{setChecking(true);setLocStatus('Getting your location…');try{const pos=await getLocation();const c=pos.coords;const locationText=c.latitude.toFixed(5)+', '+c.longitude.toFixed(5);const {error}=await sb.from('neo_punches').insert({user_id:session.user.id,punch_type:type,latitude:c.latitude,longitude:c.longitude,location_text:locationText});if(error)throw error;setLocStatus('Location captured: '+locationText);await refresh();say('Punch '+type+' recorded with location.','ok');}catch(err){const msg=explain(err);setLocStatus(msg);say(msg,'err');}finally{setChecking(false);}};return role==='master'?<div className="card"><h3>All punch records</h3><table><thead><tr><th>User</th><th>Type</th><th>Time</th><th>Location</th></tr></thead><tbody>{db.punches.map(p=><tr key={p.id}><td>{db.users.find(u=>u.id===p.user_id)?.full_name||p.user_id}</td><td>{p.punch_type}</td><td>{new Date(p.punched_at).toLocaleString()}</td><td>{p.location_text||'—'}</td></tr>)}</tbody></table></div>:<div><div className="card"><h3>Punch In / Punch Out</h3><p className="muted">Location is required for punch records. First test the device location if needed.</p>{locStatus&&<div className="msg ok">{locStatus}</div>}<div className="row" style={{justifyContent:'flex-start',flexWrap:'wrap'}}><button className="btn ghost" disabled={checking} onClick={testLocation}>{checking?'Checking…':'Test Location'}</button><button className="btn" disabled={checking} onClick={()=>punch('IN')}>Punch In</button><button className="btn ghost" disabled={checking} onClick={()=>punch('OUT')}>Punch Out</button></div></div><div className="card"><h3>My punch history</h3><table><thead><tr><th>Type</th><th>Time</th><th>Location</th></tr></thead><tbody>{mine.map(p=><tr key={p.id}><td>{p.punch_type}</td><td>{new Date(p.punched_at).toLocaleString()}</td><td>{p.location_text||'—'}</td></tr>)}</tbody></table></div></div>}

function Monthly({db,say}){return <div className="card"><h3>Monthly work schedule report</h3><p className="muted">The database table is ready for automated month-end generation. The next step is wiring this to a scheduled server-side job.</p>{db.monthlyReports.map(r=><div key={r.id} style={{marginTop:12}}><b>{r.report_month}</b><pre style={{whiteSpace:'pre-wrap'}}>{JSON.stringify(r.summary,null,2)}</pre></div>)}</div>}

function Access({db,refresh,say}){const [busy,setBusy]=useState(false);const [projectName,setProjectName]=useState('');const [siteCode,setSiteCode]=useState('');const [creating,setCreating]=useState(false);const toggle=async(u,p)=>{setBusy(true);const has=u.projectIds.includes(p.id);let q;if(has)q=await sb.from('neo_project_memberships').delete().match({user_id:u.id,project_id:p.id});else q=await sb.from('neo_project_memberships').insert({user_id:u.id,project_id:p.id,can_update:u.role==='engineer'});if(q.error)say(q.error.message,'err');await refresh();setBusy(false)};const setRole=async(u,role)=>{const {error}=await sb.from('neo_profiles').update({role,updated_at:new Date().toISOString()}).eq('id',u.id);if(error)return say(error.message,'err');await refresh();};const createProject=async()=>{const name=projectName.trim();const code=siteCode.trim();if(!name||!code)return say('Project name and site code are required.','err');setCreating(true);const {error}=await sb.from('neo_projects').insert({name,site_code:code,active:true});if(error){setCreating(false);return say(error.message.includes('duplicate')?'Site code already exists. Please use a unique code.':error.message,'err')}setProjectName('');setSiteCode('');await refresh();setCreating(false);say('Project/site created successfully. You can assign users to it below.');};return <div><div className="card"><div className="row"><div><h3 style={{marginBottom:4}}>Create Project / Site</h3><p className="muted">Add as many projects/sites as needed. New projects will automatically appear in the access matrix below.</p></div><span className="pill pending">{db.projects.length} projects</span></div><div className="grid2"><div><label>Project / Site Name</label><input value={projectName} onChange={e=>setProjectName(e.target.value)} placeholder="e.g. Pune Tower Project"/></div><div><label>Site Code</label><input value={siteCode} onChange={e=>setSiteCode(e.target.value.toUpperCase())} placeholder="e.g. PUNE-001"/></div></div><div style={{marginTop:12}}><button className="btn" disabled={creating} onClick={createProject}>{creating?'Creating…':'Create Project'}</button></div></div><div className="card"><h3>Users & project access</h3><p className="muted">Master can assign role and project access. RLS enforces access in the database.</p><table><thead><tr><th>Name</th><th>Role</th>{db.projects.map(p=><th key={p.id}>{p.name}<div className="muted">{p.site_code||''}</div></th>)}</tr></thead><tbody>{db.users.map(u=><tr key={u.id}><td>{u.full_name}</td><td><select value={u.role} disabled={u.id===db.me?.id} onChange={e=>setRole(u,e.target.value)}><option value="master">master</option><option value="engineer">engineer</option><option value="client">client</option><option value="architect">architect</option></select></td>{db.projects.map(p=><td key={p.id}><input type="checkbox" checked={u.projectIds.includes(p.id)} disabled={busy||u.role==='master'} onChange={()=>toggle(u,p)}/></td>)}</tr>)}</tbody></table></div></div>}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
